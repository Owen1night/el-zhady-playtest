name: Check website foundation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LIVE_QUIZ_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:mixed-content
      - run: npm run check:solo-content
      - name: Verify reviewed assets and build an offline review fixture
        run: |
          node scripts/fetch-reviewed-media.mjs --check
          node playtest/prepare-isolated.mjs --self-test
          npm run build
          node --check scripts/pages-health.mjs
        env:
          VITE_PUBLIC_SITE_URL: https://owen1night.github.io/el-zhady-playtest/
          VITE_SUPABASE_URL: https://tttttttttttttttttttt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_review_fixture_only
          VITE_TURNSTILE_SITE_KEY: ''
      - name: Install Chromium and WebKit for interaction checks
        run: npx playwright install --with-deps chromium webkit
      - name: Check mixed games and reading layouts
        run: |
          npm run test:mixed:browser
          npm run test:learning:browser
          npm run test:practice:browser
          npm run test:videos:browser
          BROWSER=webkit npm run test:learning:browser
          BROWSER=webkit npm run test:practice:browser
          BROWSER=webkit npm run test:videos:browser
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-preview-screenshots
          path: |
            work/mixed-browser/*.png
            work/learning-browser/*.png
            work/practice-browser/*.png
            work/videos-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
