name: Collect reviewed public-domain media
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  media:
    if: github.repository == 'Owen1night/el-zhady-playtest' && github.head_ref == 'codex/solo-practice-and-archive-media' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-reviewed-media.mjs
      - name: Commit only reviewed image assets on this draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/archive
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle reviewed public-domain commemorative portraits'
            git push origin HEAD:${{ github.head_ref }}
          fi
